name: Android-app
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bouw:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: "Bundel: de webapp in de app zetten"
        run: node scripts/sync-assets.mjs
      - name: "Proeven: spellogica, routes en de dataset"
        run: node --test test/*.test.js
      - name: "Proeven: de schil, zonder Android"
        run: |
          mkdir -p android/out-test
          javac -d android/out-test \
            android/app/src/main/java/nl/werdens/sjpeelavond/Schermen.java \
            android/app/src/main/java/nl/werdens/sjpeelavond/Buiten.java \
            android/tests/SchermenTest.java \
            android/tests/BuitenTest.java
          java -cp android/out-test SchermenTest
          java -cp android/out-test BuitenTest
      - name: "Zelfcontrole: de hulpscripts en hun controles"
        run: python3 scripts/zelfcontrole.py
      - name: "Proeven: een echte QR-code inlezen (zonder camera)"
        run: |
          # De proef bouwt zelf een QR-code, zet die om naar het beeldformaat van de
          # camera en eist dat QrLezer de tekst er weer uithaalt.
          gradle -p android :app:testDebugUnitTest
      - name: Ondertekeningssleutel uitpakken
        run: |
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.p12
          test "$(wc -c < android/app/release.p12)" -gt 1000
          echo "ANDROID_KEYSTORE_PATH=$PWD/android/app/release.p12" >> "$GITHUB_ENV"
      - name: Debug- en release-APK bouwen
        run: gradle -p android :app:assembleDebug :app:assembleRelease
      - name: versionCode komt overeen met version.txt
        run: |
          VN=$(cat android/version.txt)
          EXPECTED=$(python3 -c "a='$VN'.split('.');print(int(a[0])*10000+int(a[1])*100+int(a[2]))")
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | tail -1)
          "$AAPT" dump badging android/app/build/outputs/apk/release/app-release.apk > /tmp/badging.txt
          echo "--- badging ---"
          grep -E "^package:|^launchable-activity:" /tmp/badging.txt
          grep -q "versionCode='$EXPECTED'" /tmp/badging.txt
          grep -q "versionName='$VN'" /tmp/badging.txt
      - name: Release-APK is ondertekend en installeerbaar
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk > /tmp/sign.txt
          echo "--- handtekening ---"
          grep -E "scheme|Verified using" /tmp/sign.txt | head -8
          grep -qi 'CN=Thuis' /tmp/sign.txt
          echo "release sha256: $(sha256sum android/app/build/outputs/apk/release/app-release.apk | cut -d' ' -f1)"
      - name: De bundel en de klassen zitten echt in de APK
        run: |
          echo "--- release ---"
          python3 scripts/check-apk.py android/app/build/outputs/apk/release/app-release.apk
          echo "--- debug ---"
          python3 scripts/check-apk.py android/app/build/outputs/apk/debug/app-debug.apk
      - name: APK's op de release zetten
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VN=$(cat android/version.txt)
          TAG="v$VN"
          mv android/app/build/outputs/apk/release/app-release.apk "Sjpeelavond-Android-$VN.apk"
          mv android/app/build/outputs/apk/debug/app-debug.apk "Sjpeelavond-Android-$VN-debug.apk"
          ls -la Sjpeelavond-Android-*.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Sjpeelavond-Android-*.apk --clobber
          else
            gh release create "$TAG" --title "Sjpeelavond $VN" \
              --notes "Ondertekende APK van Sjpeelavond $VN voor Android. Installeer Sjpeelavond-Android-$VN.apk op je telefoon; de -debug-versie is alleen voor de emulatorrooktest." \
              Sjpeelavond-Android-*.apk
          fi
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size) bytes"'

  emulator:
    needs: bouw
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # android-36 = Android 16, de versie onder One UI 8 op een Galaxy S25.
          packages: platform-tools platforms;android-36 build-tools;35.0.0 emulator system-images;android-36;google_apis;x86_64
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Debug-APK bouwen voor de rooktest
        run: |
          node scripts/sync-assets.mjs
          gradle -p android :app:assembleDebug
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/app-debug.apk
      - name: AVD met het scherm van een Galaxy S25
        run: bash scripts/maak-s25-avd.sh
      - name: Emulator met S25-profiel en rooktest
        run: bash scripts/android-emulator.sh
      - name: Schermafbeeldingen in de repo zetten
        if: always()
        run: |
          ls -la screenshots/ || true
          mkdir -p docs/apk
          cp screenshots/apk-*.png docs/apk/ 2>/dev/null || true
          cp screenshots/scherm.txt docs/apk/ 2>/dev/null || true
          cp screenshots/logcat-*.txt docs/apk/ 2>/dev/null || true
          # Hard falen als de beelden niet in docs/ belanden; een te brede
          # gitignore-regel liet ze eerder stil verdwijnen.
          if git check-ignore -v docs/apk/apk-start.png >/dev/null 2>&1; then
            echo "docs/apk wordt genegeerd door .gitignore"; exit 1
          fi
          # De namen die de rooktest echt maakt: het startscherm, het scannen van een
          # kaartje, en het kaartje van Raoj 's. (Er heeft hier eerder apk-spel.png
          # gestaan, een naam die de rooktest nooit schrijft — daardoor zakte deze stap
          # altijd, ook als de rooktest zelf groen was.)
          test -s docs/apk/apk-start.png
          test -s docs/apk/apk-scannen.png
          test -s docs/apk/apk-scannen-raojs.png
          git config user.name "hermes-ci"
          git config user.email "ci@werdensmedia.local"
          git add docs
          if git diff --cached --quiet; then
            echo "geen nieuwe beelden"
          else
            git commit -m "Schermafbeeldingen uit de Android-emulator (versie $(cat android/version.txt))"
            git pull --rebase --autostash
            git push
          fi
